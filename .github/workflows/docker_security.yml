name: Docker Build and Security Scan

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
    branches: [master]
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  buildx:
    permissions:
      contents: read
      actions: read            # Required for upload-sarif to get workflow run info
      security-events: write   # Required for uploading SARIF results
      pull-requests: write     # Required for PR comments summarizing vulnerabilities
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: runscripts/container/Dockerfile
          load: true
          tags: vecoli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Analyze for critical and high CVEs
        id: docker-scout-cves
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864
        with:
          command: cves,recommendations
          image: vecoli:latest
          sarif-file: sarif.output.json
          summary: true
          only-severities: critical,high,medium
          only-fixed: true

      - name: Upload SARIF result
        id: upload-sarif
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          sarif_file: sarif.output.json
