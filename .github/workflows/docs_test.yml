name: Test Documentation

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
          version: "0.13.1"
      - name: Install Pandoc
        run: sudo apt-get install pandoc
      - name: Install model
        run: USE_CYTHON=1 uv sync --frozen --extra docs
      - name: Build documentation
        run: |
          cd doc
          uv run make html
