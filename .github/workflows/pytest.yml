# Modified from GitHub Actions template

name: QA

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha|| github.ref }}
  cancel-in-progress: true

jobs:
  Pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
          persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        enable-cache: true
        version: "0.13.1"
    - name: Install model
      run: USE_CYTHON=1 uv sync --frozen --extra dev
    - name: Cache ParCa simulation data
      id: cache-parca
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: out/kb/*.cPickle
        key: parca-${{ hashFiles('reconstruction/ecoli/**/*.py', 'reconstruction/ecoli/**/*.tsv') }}
    - name: Run ParCa
      if: steps.cache-parca.outputs.cache-hit != 'true'
      run: |
        uv run --env-file .env runscripts/parca.py \
          --config configs/gha_pytest.json
    - name: Extract tetracycline gene regulation parameters
      run: |
        uv run --env-file .env data/marA_binding/get_TU_ID.py \
          -s out/kb/simData.cPickle
    - name: Test with pytest
      run: |
        uv run --env-file .env pytest --durations=0
  Mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
          persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        enable-cache: true
        version: "0.13.1"
    - name: Install model
      run: USE_CYTHON=1 uv sync --frozen --extra dev
    - name: Mypy
      run: |
        uv run mypy
  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
          persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        enable-cache: true
        version: "0.13.1"
    - name: Install model
      run: USE_CYTHON=1 uv sync --frozen --extra dev
    - name: Ruff
      run: |
        uv run ruff check doc ecoli wholecell runscripts validation reconstruction
